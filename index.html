<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên & xếp loại học tập</title>

    <!-- Kết nối file CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Tiêu đề -->
        <header class="header">
            <h1>QUẢN LÝ SINH VIÊN</h1>
            <p>& XẾP LOẠI HỌC TẬP</p>
        </header>


        <!-- Form nhập thông tin -->
        <section class="form-section">

            <h2>Thông tin sinh viên</h2>

            <form id="studentForm">

                <!-- Họ tên -->
                <div class="form-group">
                    <label for="studentName">Họ và tên sinh viên</label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Nhập họ và tên sinh viên"
                    >
                </div>


                <!-- Điểm các môn học -->
                <h2 class="subject-title">Điểm các môn học</h2>


                <div class="subjects">

                    <!-- Giải tích 1 -->
                    <div class="form-group">
                        <label for="calculus">1. Giải tích 1</label>

                        <input
                            type="number"
                            id="calculus"
                            min="0"
                            max="10"
                            step="0.01"
                            placeholder="0 - 10"
                        >
                    </div>


                    <!-- Đại số tuyến tính -->
                    <div class="form-group">
                        <label for="linearAlgebra">2. Đại số tuyến tính</label>

                        <input
                            type="number"
                            id="linearAlgebra"
                            min="0"
                            max="10"
                            step="0.01"
                            placeholder="0 - 10"
                        >
                    </div>


                    <!-- Xác suất thống kê -->
                    <div class="form-group">
                        <label for="probability">3. Xác suất thống kê</label>

                        <input
                            type="number"
                            id="probability"
                            min="0"
                            max="10"
                            step="0.01"
                            placeholder="0 - 10"
                        >
                    </div>


                    <!-- Tin học đại cương -->
                    <div class="form-group">
                        <label for="informatics">4. Tin học đại cương</label>

                        <input
                            type="number"
                            id="informatics"
                            min="0"
                            max="10"
                            step="0.01"
                            placeholder="0 - 10"
                        >
                    </div>


                    <!-- Xây dựng ứng dụng Web -->
                    <div class="form-group">
                        <label for="webDevelopment">
                            5. Xây dựng ứng dụng Web
                        </label>

                        <input
                            type="number"
                            id="webDevelopment"
                            min="0"
                            max="10"
                            step="0.01"
                            placeholder="0 - 10"
                        >
                    </div>

                </div>


                <!-- Khu vực hiển thị lỗi -->
                <div id="errorMessage" class="error-message"></div>


                <!-- Nút tính -->
                <button type="submit" class="calculate-button">
                    Tính kết quả
                </button>

            </form>

        </section>


        <!-- Khu vực kết quả -->
        <section id="resultSection" class="result-section">

            <h2>Kết quả học tập</h2>

            <!-- Tên sinh viên -->
            <div class="student-result">
                <strong>Sinh viên:</strong>
                <span id="resultName"></span>
            </div>


            <!-- Bảng điểm -->
            <table class="result-table">

                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Môn học</th>
                        <th>Điểm</th>
                    </tr>
                </thead>

                <tbody id="resultTableBody">
                    <!-- JavaScript sẽ thêm dữ liệu vào đây -->
                </tbody>

            </table>


            <!-- Điểm trung bình -->
            <div class="average-result">
                <span>Điểm trung bình</span>
                <strong id="averageScore">0.00</strong>
            </div>


            <!-- Xếp loại -->
            <div class="classification-result">
                <span>Xếp loại học tập</span>
                <strong id="classification">-</strong>
            </div>

        </section>

    </div>


    <!-- Kết nối file JavaScript -->
    <script src="script.js"></script>

</body>
</html>
